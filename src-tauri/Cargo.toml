[package]
name = "dahuangdog"
version = "0.1.0"
description = "住在 Windows 里的 AI 看门狗"
authors = ["DahuangDog contributors"]
edition = "2021"

[lib]
name = "dahuangdog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
pretty_assertions = "1"
